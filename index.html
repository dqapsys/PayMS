firebase.initializeApp({

const db=firebase.firestore();
const PAYMS_COL='dqap_payms_requests',SETTINGS_COL='dqap_payms_settings',USERS_COL='dqap_users',PROJ_COL='dqap_projects',CRM_CUSTOMERS='dqap_crm_customers',CRM_DEALS='dqap_crm_deals';
const UPLOAD_RECEIPT_URL='https://upload-receipt-932523956178.asia-south2.run.app';
const MAX_RECEIPT_BYTES=6*1024*1024;
function compressImageFile(file,maxWidth=1600,quality=0.72){
  return new Promise((resolve,reject)=>{
    const img=new Image();const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result};
    reader.onerror=reject;
    img.onload=()=>{
      const scale=Math.min(1,maxWidth/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob=>resolve(new File([blob],file.name.replace(/\.(png|jpe?g|webp)$/i,'.jpg'),{type:'image/jpeg'})),'image/jpeg',quality);
    };
    img.onerror=reject;reader.readAsDataURL(file);
  });
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
async function uploadReceiptIfAny(expenseId,submitterName){
  const input=el('f-receipt');
  if(!input||!input.files||!input.files[0])return null;
  let file=input.files[0];
  if(file.size>MAX_RECEIPT_BYTES)throw new Error(`Receipt file is too large (${(file.size/1024/1024).toFixed(1)}MB). Max is 6MB.`);
  if(/^image\//.test(file.type)&&file.type!=='application/pdf'){
    try{file=await compressImageFile(file)}catch(e){console.warn('Compression failed, uploading original',e)}
  }
  const fileBase64=await fileToBase64(file);
  const resp=await fetch(UPLOAD_RECEIPT_URL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fileName:file.name,mimeType:file.type||'application/octet-stream',fileBase64,expenseId:expenseId||'',submitterName:submitterName||''})
  });
  if(!resp.ok){const err=await resp.json().catch(()=>({}));throw new Error(err.error||'Receipt upload failed')}
  const data=await resp.json();
  return{receiptUrl:data.webViewLink,receiptFileId:data.fileId,receiptFileName:data.fileName,receiptSizeKB:Math.round((data.sizeBytes||0)/1024)};
}
const PAYMS_BUILD='20260630.8';
let currentUser=null,currentUserRole=null,currentUserData=null,wikiSession=null,authInitialized=false;
let paymsData=[],usersData=[],projectsData=[],contactsData=[],dealsData=[],paymsUnsub=null,settingsUnsub=null,paymsSettings={reportingManagers:{}},activeTab='dashboard',selectedPaymentId='';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function el(id){return document.getElementById(id)}
function g(id){return(el(id)?.value||'').trim()}
function fmtAmt(n){return Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().split('T')[0]}
function nowIso(){return new Date().toISOString()}
function norm(s){return String(s||'').trim().toLowerCase()}
function roleName(){return currentUserData?.displayName||currentUserData?.fullName||currentUser||'-'}
function isUser(name){return norm(currentUser)===norm(name)||norm(currentUserData?.fullName)===norm(name)}
function isAdmin(){return ['admin','tech_admin'].includes(norm(currentUserRole))||norm(currentUser)==='updesh'}
function isDev(){return norm(currentUser)==='dev'||norm(currentUserData?.fullName)==='dev'||isAdmin()}
function isPratim(){return norm(currentUser)==='pratim'||norm(currentUserData?.fullName).includes('pratim')||isAdmin()}
function isUpdesh(){return norm(currentUser)==='updesh'||norm(currentUserData?.fullName).includes('updesh')||isAdmin()}
function canManageSettings(){return norm(currentUser)==='updesh'||norm(currentUserData?.fullName).includes('updesh')}
function showToast(msg,type='success'){const t=document.createElement('div');t.className='toast '+(type==='error'?'error':'success');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function showError(message){const d=document.createElement('div');d.className='error-screen';d.innerHTML=`<div class="error-card"><h2>PayMS Access</h2><p style="color:var(--t2);line-height:1.6">${esc(message)}</p><button class="btn primary" style="margin-top:16px" onclick="location.href='https://dqapsys.github.io/dqap-wiki/'">Go to Wiki</button></div>`;document.body.appendChild(d);el('appContainer').style.display='none'}

function initializeAuth(){
  if(authInitialized)return;authInitialized=true;
  let sess=null;
  const fragment=new URLSearchParams(window.location.hash.slice(1));
  const query=new URLSearchParams(window.location.search);
  const handoffSession=fragment.get('sess')||query.get('sess');
  const receivedHandoff=!!handoffSession;
  try{sess=sessionStorage.getItem('dqap_sess')}catch(e){}
  if(!sess)sess=handoffSession;
  if(sess){try{sessionStorage.setItem('dqap_sess',sess)}catch(e){} if(receivedHandoff)history.replaceState(null,document.title,window.location.pathname+window.location.search)}
  if(!sess){showError('This page must be accessed through the Wiki portal. Please login to Wiki first.');return}
  try{wikiSession=JSON.parse(sess);autoLoginFromWiki(wikiSession)}catch(e){showError('Session error. Please login to Wiki and try again.')}
}
async function autoLoginFromWiki(session){
  try{
    const username=session.username,displayName=session.displayName||session.fullName||username;
    const usersRef=db.collection(USERS_COL);
    const q=await usersRef.where('username','==',username).limit(1).get();
    let userData=!q.empty?q.docs[0].data():null;
    if(!userData){const legacy=await usersRef.doc(username).get();if(legacy.exists)userData=legacy.data()}
    if(!userData&&session.username&&session.role)userData={username:session.username,fullName:session.fullName||displayName,displayName,role:session.role,isAdmin:session.isAdmin};
    if(!userData){showError(`User "${username}" not found in Wiki users.`);return}
    currentUser=username;currentUserRole=userData.role||'user';currentUserData={...userData,displayName:userData.displayName||userData.fullName||displayName};
    el('currentUser').textContent=`${currentUserData.displayName||username} (${currentUserRole})`;
    el('appContainer').style.display='block';
    el('settingsTabBtn').style.display=canManageSettings()?'flex':'none';
    await loadReferenceData();
    startSettingsListen();
    startPaymsListen();
    showToast('Welcome, '+(currentUserData.displayName||username));
  }catch(error){showError('Login failed: '+error.message)}
}
async function loadReferenceData(){
  const [usersSnap,projSnap,contactsSnap,dealsSnap]=await Promise.allSettled([
    db.collection(USERS_COL).orderBy('fullName','asc').get(),
    db.collection(PROJ_COL).orderBy('createdAt','desc').get(),
    db.collection(CRM_CUSTOMERS).limit(300).get(),
    db.collection(CRM_DEALS).limit(300).get()
  ]);
  if(usersSnap.status==='fulfilled')usersData=usersSnap.value.docs.map(d=>({id:d.id,...d.data()}));
  if(projSnap.status==='fulfilled')projectsData=projSnap.value.docs.map(d=>({id:d.id,...d.data()}));
  if(contactsSnap.status==='fulfilled')contactsData=contactsSnap.value.docs.map(d=>({id:d.id,...d.data()}));
  if(dealsSnap.status==='fulfilled')dealsData=dealsSnap.value.docs.map(d=>({id:d.id,...d.data()}));
}
function startPaymsListen(){
  if(paymsUnsub)paymsUnsub();
  paymsUnsub=db.collection(PAYMS_COL).orderBy('createdAt','desc').onSnapshot(sn=>{paymsData=sn.docs.map(d=>({id:d.id,...d.data()}));renderAll()},err=>{showToast('Could not load PayMS data: '+err.message,'error')});
}
function startSettingsListen(){
  if(settingsUnsub)settingsUnsub();
  settingsUnsub=db.collection(SETTINGS_COL).doc('hierarchy').onSnapshot(doc=>{
    paymsSettings=doc.exists?{reportingManagers:{},...doc.data()}:{reportingManagers:{}};
    renderAll();
  },err=>showToast('Could not load PayMS settings: '+err.message,'error'));
}

function switchTab(tab){if(tab==='settings'&&!canManageSettings())return showToast('Only Updesh can open PayMS settings','error');activeTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+tab));renderAll()}
function renderAll(){renderDashboard();renderNew();renderApprovals();renderPayments();renderAudit();renderSettings()}
function statusBadge(s){const map={PENDING_MANAGER:['Manager Verify','s-manager'],PENDING_PRATIM:['Pratim Recommend','s-pratim'],PENDING_UPDESH:['Updesh Approval','s-updesh'],READY_FOR_PAYMENT:['Ready for Dev','s-dev'],PAID:['PAID','s-paid'],REJECTED:['Rejected','s-rej']};const m=map[s]||['Open','s-open'];return`<span class="badge ${m[1]}">${m[0]}</span>`}
function projectLabel(id){const p=projectsData.find(x=>x.id===id);return p?`${p.number||''} ${p.name||p.projName||''}`.trim():'-'}
function crmLabel(type,id){const row=(type==='Deal'?dealsData:contactsData).find(x=>x.id===id);return row?(type==='Deal'?(row.title||row.dealTitle||'Deal'):(row.name||row.company||'Contact')):'-'}
function isPratimValue(v){return norm(v)==='pratim'||norm(v).includes('pratim')}
function isUpdeshValue(v){return norm(v)==='updesh'||norm(v).includes('updesh')}
function managerIsPratim(r){return isPratimValue(r.managerUsername)||isPratimValue(r.managerName)}
function managerIsUpdesh(r){return isUpdeshValue(r.managerUsername)||isUpdeshValue(r.managerName)}
function canApprove(r){if(r.status==='PENDING_MANAGER')return currentUserRole==='manager'||isUser(r.managerUsername)||isUser(r.managerName)||isAdmin();if(r.status==='PENDING_PRATIM')return isPratim();if(r.status==='PENDING_UPDESH')return isUpdesh();return false}
function canReferToPratim(r){return r.status==='PENDING_UPDESH'&&managerIsUpdesh(r)&&isUpdesh()&&!r.referredToPratim}
function nextStatus(s){return{PENDING_MANAGER:'PENDING_PRATIM',PENDING_PRATIM:'PENDING_UPDESH',PENDING_UPDESH:'READY_FOR_PAYMENT'}[s]||s}
function actionLabel(s){return{PENDING_MANAGER:'Verified and forwarded to Pratim',PENDING_PRATIM:'Verified / recommended and forwarded to Updesh',PENDING_UPDESH:'Verified and approved for Dev payment'}[s]||'Updated'}
function initialWorkflowForManager(mgr){
  const username=mgr?.username||mgr?.fullName||'',fullName=mgr?.fullName||mgr?.username||'';
  if(isUpdeshValue(username)||isUpdeshValue(fullName))return{status:'PENDING_UPDESH',audit:'Created request and sent directly to Updesh for verification and approval'};
  if(isPratimValue(username)||isPratimValue(fullName))return{status:'PENDING_PRATIM',audit:'Created request and sent directly to Pratim for verification / recommendation'};
  return{status:'PENDING_MANAGER',audit:'Created request and sent to Reporting Manager'};
}
function userKey(u){return norm(u?.username||u?.fullName||u)}
function userDisplay(u){return u?`${u.fullName||u.displayName||u.username||''}${u.username?' ('+u.username+')':''}`:'-'}
function currentSubmitterManager(){
  const map=paymsSettings.reportingManagers||{};
  const key=norm(currentUser);
  const byUser=map[key]||map[norm(currentUserData?.fullName)];
  if(byUser)return byUser;
  return null;
}
function managerRecordFromSetting(setting){
  if(!setting)return null;
  return usersData.find(u=>norm(u.username)===norm(setting.username)||norm(u.fullName)===norm(setting.fullName)||norm(u.username)===norm(setting)||norm(u.fullName)===norm(setting))||null;
}

function renderDashboard(){
  const total=paymsData.length,pending=paymsData.filter(r=>!['PAID','REJECTED'].includes(r.status)).length,ready=paymsData.filter(r=>r.status==='READY_FOR_PAYMENT').length,paid=paymsData.filter(r=>r.status==='PAID').length,amount=paymsData.reduce((s,r)=>s+Number(r.amount||0),0);
  el('tab-dashboard').innerHTML=`<div class="stats">
    <div class="stat"><div class="stat-icon"><i class="ti ti-file-invoice"></i></div><div><div class="stat-value">${total}</div><div class="stat-label">Requests</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-clock"></i></div><div><div class="stat-value">${pending}</div><div class="stat-label">In workflow</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-building-bank"></i></div><div><div class="stat-value">${ready}</div><div class="stat-label">Ready for Dev</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-currency-rupee"></i></div><div><div class="stat-value">Rs ${fmtAmt(amount)}</div><div class="stat-label">Total value</div></div></div>
  </div><div class="card"><div class="card-header">Recent payment requests <button class="btn sm primary" onclick="switchTab('new')"><i class="ti ti-plus"></i>New</button></div>${requestTable(paymsData.slice(0,10),false)}</div>`;
}
function renderNew(){
  const managers=usersData.filter(u=>['manager','admin'].includes(norm(u.role))||norm(u.username)==='updesh'||norm(u.username)==='pratim');
  const mappedManager=managerRecordFromSetting(currentSubmitterManager());
  const mappedValue=mappedManager?(mappedManager.username||mappedManager.fullName):'';
  const managerOptions=(mappedManager?[mappedManager]:managers).map(u=>`<option value="${esc(u.username||u.fullName)}">${esc(u.fullName||u.username)} (${esc(u.role||'user')})</option>`).join('')||'<option value="">No reporting manager mapped</option>';
  const crmOpts=[...contactsData.map(c=>({type:'Contact',id:c.id,label:c.name||c.company||c.contact||c.id})),...dealsData.map(d=>({type:'Deal',id:d.id,label:d.title||d.dealTitle||d.id}))];
  el('tab-new').innerHTML=`<div class="card"><div class="card-header">Create payment request</div>
    <div class="form-row"><div class="form-group"><label class="req">Expense Type</label><select id="f-type" onchange="toggleTourRules()"><option>Tour Advance</option><option>Vendor Payment</option><option>Reimbursement</option><option>Other Advance</option></select></div><div class="form-group"><label class="req">Amount</label><input id="f-amount" type="number" min="1"></div><div class="form-group"><label class="req">Reporting Manager</label><select id="f-manager" ${mappedManager?'disabled':''}>${managerOptions}</select><div class="muted" style="margin-top:4px">${mappedManager?'Auto-assigned by Updesh settings.':'No mapped manager found; ask Updesh to configure Settings.'}</div></div></div>
    <div class="form-row"><div class="form-group"><label class="req">Title</label><input id="f-title" placeholder="Tour advance / vendor invoice"></div><div class="form-group"><label id="projectLabel" class="req">Wiki Project Link</label><select id="f-project">${projectsData.map(p=>`<option value="${p.id}">${esc((p.number||'')+' '+(p.name||p.projName||''))}</option>`).join('')||'<option value="">No projects found</option>'}</select></div><div class="form-group"><label id="crmLabel" class="req">CRM Contact / Deal</label><select id="f-crm">${crmOpts.map(o=>`<option value="${o.type}|${o.id}">${o.type}: ${esc(o.label)}</option>`).join('')||'<option value="">CRM ready for expansion</option>'}</select></div></div>
    <div class="form-row"><div class="form-group"><label>Vendor / Payee</label><input id="f-vendor" placeholder="Required for vendor payment"></div><div class="form-group"><label class="req">Purpose / Notes</label><textarea id="f-purpose"></textarea></div></div>
    <div class="form-row"><div class="form-group"><label>Receipt / Invoice (PDF, JPG, PNG - max 6MB)</label><input type="file" id="f-receipt" accept=".pdf,.jpg,.jpeg,.png,.webp"><div id="receipt-status" class="muted" style="margin-top:4px"></div></div></div>
    <button class="btn primary" id="submit-btn" onclick="submitRequest()"><i class="ti ti-send"></i>Submit to Reporting Manager</button>
  </div>`;toggleTourRules();
}
function toggleTourRules(){const tour=g('f-type')==='Tour Advance';const p=el('projectLabel'),c=el('crmLabel');if(p)p.className=tour?'req':'';if(c)c.className=tour?'req':''}
async function submitRequest(){
  const type=g('f-type'),amount=Number(g('f-amount')),title=g('f-title'),projectId=g('f-project'),crmRaw=g('f-crm'),vendor=g('f-vendor'),purpose=g('f-purpose'),managerRaw=g('f-manager');
  if(!title||!amount||!purpose)return showToast('Enter title, amount and purpose','error');
  if(!managerRaw)return showToast('Reporting manager is not mapped. Ask Updesh to configure PayMS Settings.','error');
  if(type==='Tour Advance'&&(!projectId||!crmRaw))return showToast('Tour Advance requires Wiki project and CRM contact/deal linkage','error');
  if(type==='Vendor Payment'&&!vendor)return showToast('Vendor / payee is required for vendor payment','error');
  const [crmType,crmId]=(crmRaw||'|').split('|');const mgr=usersData.find(u=>(u.username||u.fullName)===managerRaw)||{};
  const ref=db.collection(PAYMS_COL).doc();
  const flow=initialWorkflowForManager(mgr);
  const btn=el('submit-btn'),statusEl=el('receipt-status');
  let receiptFields={};
  try{
    if(el('f-receipt')&&el('f-receipt').files&&el('f-receipt').files[0]){
      if(btn)btn.disabled=true;
      if(statusEl)statusEl.textContent='Uploading receipt...';
      receiptFields=await uploadReceiptIfAny(ref.id,roleName())||{};
      if(statusEl)statusEl.textContent=receiptFields.receiptFileName?'Receipt attached: '+receiptFields.receiptFileName:'';
    }
  }catch(e){
    if(btn)btn.disabled=false;
    return showToast(e.message||'Receipt upload failed','error');
  }
  const req={requestNo:'PAY-'+ref.id.slice(0,6).toUpperCase(),type,title,amount,projectId,crmType,crmId,vendor,purpose,status:flow.status,submitterUsername:currentUser,submitterName:roleName(),managerUsername:mgr.username||managerRaw,managerName:mgr.fullName||managerRaw,createdAt:nowIso(),updatedAt:nowIso(),audit:[{time:nowIso(),actor:roleName(),action:flow.audit}],...receiptFields};
  await ref.set(req);if(btn)btn.disabled=false;showToast('Request submitted');switchTab('dashboard');
}
function requestTable(list,actions){
  if(!list.length)return'<div class="empty">No payment requests found.</div>';
  return`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Request</th><th>Links</th><th>Submitter</th><th class="right">Amount</th><th>Status</th><th>Updated</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${list.map(r=>`<tr><td class="strong">${esc(r.requestNo||r.id)}</td><td><b>${esc(r.title)}</b><div class="muted">${esc(r.type)}${r.vendor?' · '+esc(r.vendor):''}</div>${r.receiptUrl?`<div class="muted"><a href="${esc(r.receiptUrl)}" target="_blank" rel="noopener"><i class="ti ti-paperclip"></i> Receipt</a></div>`:''}</td><td>${esc(projectLabel(r.projectId))}<div class="muted">${esc(r.crmType||'CRM')}: ${esc(crmLabel(r.crmType,r.crmId))}</div></td><td>${esc(r.submitterName||r.submitterUsername)}<div class="muted">Mgr: ${esc(r.managerName||r.managerUsername)}</div></td><td class="right strong">Rs ${fmtAmt(r.amount)}</td><td>${statusBadge(r.status)}</td><td>${esc((r.updatedAt||'').slice(0,10))}</td>${actions?`<td><button class="btn sm primary" onclick="approveRequest('${r.id}')">Approve</button> <button class="btn sm bad" onclick="rejectRequest('${r.id}')">Reject</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function renderApprovals(){const queue=paymsData.filter(canApprove);el('tab-approvals').innerHTML=`<div class="card"><div class="card-header">My approval queue</div>${requestTable(queue,true)}</div><div class="card"><div class="card-header">All open requests</div>${requestTable(paymsData.filter(r=>r.status!=='PAID'),false)}</div>`}
async function approveRequest(id){const r=paymsData.find(x=>x.id===id);if(!r||!canApprove(r))return showToast('You are not authorized for this approval','error');const action=actionLabel(r.status),status=nextStatus(r.status),audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action}];await db.collection(PAYMS_COL).doc(id).update({status,updatedAt:nowIso(),audit});showToast(action)}
async function rejectRequest(id){const reason=prompt('Reason for rejection');if(reason===null)return;const r=paymsData.find(x=>x.id===id);const audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action:'Rejected request: '+(reason||'No reason entered')}];await db.collection(PAYMS_COL).doc(id).update({status:'REJECTED',updatedAt:nowIso(),audit});showToast('Request rejected','error')}

function actionButtons(r){const refer=canReferToPratim(r)?` <button class="btn sm" onclick="referToPratim('${r.id}')">Refer to Pratim</button>`:'';return`<button class="btn sm primary" onclick="approveRequest('${r.id}')">${r.status==='PENDING_UPDESH'?'Verify & Approve':'Verify / Recommend'}</button>${refer} <button class="btn sm bad" onclick="rejectRequest('${r.id}')">Reject</button>`}
function requestTable(list,actions){
  if(!list.length)return'<div class="empty">No payment requests found.</div>';
  return`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Request</th><th>Links</th><th>Submitter</th><th class="right">Amount</th><th>Status</th><th>Updated</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${list.map(r=>`<tr><td class="strong">${esc(r.requestNo||r.id)}</td><td><b>${esc(r.title)}</b><div class="muted">${esc(r.type)}${r.vendor?' · '+esc(r.vendor):''}</div></td><td>${esc(projectLabel(r.projectId))}<div class="muted">${esc(r.crmType||'CRM')}: ${esc(crmLabel(r.crmType,r.crmId))}</div></td><td>${esc(r.submitterName||r.submitterUsername)}<div class="muted">Mgr: ${esc(r.managerName||r.managerUsername)}</div></td><td class="right strong">Rs ${fmtAmt(r.amount)}</td><td>${statusBadge(r.status)}</td><td>${esc((r.updatedAt||'').slice(0,10))}</td>${actions?`<td>${actionButtons(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
async function approveRequest(id){const r=paymsData.find(x=>x.id===id);if(!r||!canApprove(r))return showToast('You are not authorized for this approval','error');const action=actionLabel(r.status),status=nextStatus(r.status),audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action}];await db.collection(PAYMS_COL).doc(id).update({status,updatedAt:nowIso(),audit});showToast(action)}
async function referToPratim(id){const r=paymsData.find(x=>x.id===id);if(!r||!canReferToPratim(r))return showToast('Only Updesh can refer this request to Pratim','error');const audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action:'Referred to Pratim for verification / recommendation'}];await db.collection(PAYMS_COL).doc(id).update({status:'PENDING_PRATIM',referredToPratim:true,updatedAt:nowIso(),audit});showToast('Request referred to Pratim')}

function renderPayments(){const list=paymsData.filter(r=>['READY_FOR_PAYMENT','PAID'].includes(r.status));const selected=paymsData.find(r=>r.id===selectedPaymentId)||list.find(r=>r.status==='READY_FOR_PAYMENT')||list[0];selectedPaymentId=selected?.id||'';el('tab-payments').innerHTML=`<div class="card"><div class="card-header">Approved expenses for Dev</div>${paymentTable(list)}</div><div class="card"><div class="card-header">Record payment</div>${selected?paymentForm(selected):'<div class="empty">No approved request is ready for payment.</div>'}</div>`;paymentMethodChanged()}
function paymentTable(list){if(!list.length)return'<div class="empty">No Updesh-approved payment requests.</div>';return`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Request</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.requestNo||r.id)}</td><td>${esc(r.title)}<div class="muted">${esc(r.type)}</div></td><td class="right strong">Rs ${fmtAmt(r.amount)}</td><td>${statusBadge(r.status)}</td><td><button class="btn sm" onclick="selectedPaymentId='${r.id}';renderPayments()">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function paymentForm(r){const disabled=r.status==='PAID'||!isDev()?'disabled':'';return`<div class="form-row"><div class="form-group"><label>Method</label><select id="pay-method" onchange="paymentMethodChanged()" ${disabled}><option>Bank Transfer</option><option>Cheque</option><option>Cash</option></select></div><div class="form-group"><label>Payment Date</label><input id="pay-date" type="date" value="${today()}" ${disabled}></div><div class="form-group bank-field"><label>Bank</label><input id="pay-bank" value="YES Bank" ${disabled}></div><div class="form-group utr-field"><label>UTR</label><input id="pay-utr" value="UTR202406300001" ${disabled}></div><div class="form-group cheque-field hidden"><label>Cheque Number</label><input id="pay-cheque" ${disabled}></div><div class="form-group"><label>Notes</label><textarea id="pay-notes" ${disabled}></textarea></div></div>${r.status==='PAID'?'<span class="badge s-paid">Status: PAID</span>':`<button class="btn ok" onclick="recordPayment('${r.id}')" ${disabled}><i class="ti ti-check"></i>Record Payment & Complete</button>`}${!isDev()?'<div class="muted" style="margin-top:8px">Only Dev / admin can record payment.</div>':''}`}
function paymentMethodChanged(){const m=g('pay-method');document.querySelectorAll('.bank-field').forEach(x=>x.classList.toggle('hidden',m==='Cash'));document.querySelectorAll('.utr-field').forEach(x=>x.classList.toggle('hidden',m!=='Bank Transfer'));document.querySelectorAll('.cheque-field').forEach(x=>x.classList.toggle('hidden',m!=='Cheque'))}
async function recordPayment(id){const r=paymsData.find(x=>x.id===id);if(!r||r.status!=='READY_FOR_PAYMENT')return showToast('Only ready-for-payment requests can be recorded','error');if(!isDev())return showToast('Switch to Dev finance user','error');const method=g('pay-method'),date=g('pay-date'),bank=g('pay-bank'),utr=g('pay-utr'),cheque=g('pay-cheque'),notes=g('pay-notes');if(method==='Bank Transfer'&&(!date||!bank||!utr))return showToast('Bank Transfer requires date, bank and UTR','error');if(method==='Cheque'&&(!date||!bank||!cheque))return showToast('Cheque requires date, bank and cheque number','error');if(method==='Cash'&&(!date||!notes))return showToast('Cash requires date and notes','error');const payment={method,date,bank,utr,cheque,notes,recordedBy:currentUser,recordedByName:roleName(),recordedAt:nowIso()};const audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action:`Recorded ${method} payment. Status PAID`}];await db.collection(PAYMS_COL).doc(id).update({payment,status:'PAID',updatedAt:nowIso(),audit});showToast('Status -> PAID')}
function renderAudit(){const rows=paymsData.flatMap(r=>(r.audit||[]).map(a=>({...a,requestNo:r.requestNo||r.id,title:r.title}))).sort((a,b)=>String(b.time).localeCompare(String(a.time)));el('tab-audit').innerHTML=`<div class="card"><div class="card-header">Automatic audit trail</div>${rows.length?rows.map(a=>`<div class="audit-row"><div class="muted">${esc(new Date(a.time).toLocaleString('en-IN'))}</div><div><b>${esc(a.requestNo)}</b><div class="muted">${esc(a.actor)}</div></div><div>${esc(a.action)}<div class="muted">${esc(a.title||'')}</div></div></div>`).join(''):'<div class="empty">No audit records yet.</div>'}</div>`}
function renderSettings(){
  const tab=el('tab-settings');if(!tab)return;
  if(!canManageSettings()){tab.innerHTML='';return;}
  const managers=usersData.filter(u=>['manager','admin'].includes(norm(u.role))||norm(u.username)==='pratim'||norm(u.username)==='updesh');
  const users=usersData.filter(u=>norm(u.username)!=='updesh'&&!norm(u.fullName).includes('updesh')&&norm(u.username)!=='pratim'&&!norm(u.fullName).includes('pratim'));
  const map=paymsSettings.reportingManagers||{};
  tab.innerHTML=`<div class="card"><div class="card-header">PayMS approval hierarchy <button class="btn primary sm" onclick="savePaymsSettings()"><i class="ti ti-device-floppy"></i>Save Settings</button></div>
    <div style="background:var(--pl);border-radius:8px;padding:11px 12px;margin-bottom:12px;font-size:12px;line-height:1.6">
      <b>Approval chain:</b> Submitter -> Reporting Manager -> Pratim -> Updesh -> Dev payment.<br>
      Direct reports to Pratim start at Pratim. Direct reports to Updesh start at Updesh, with an optional referral to Pratim.
    </div>
    <div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Reporting Manager</th><th>Next Levels</th></tr></thead><tbody>
      ${users.map(u=>{
        const current=map[userKey(u)]||{};
        const currentVal=current.username||current.fullName||current||'';
        const next=isUpdeshValue(currentVal)?'<span class="badge s-updesh">Direct Updesh approval</span> <span class="badge s-pratim">Pratim optional</span>':(isPratimValue(currentVal)?'<span class="badge s-pratim">Pratim verifies</span> <span class="badge s-updesh">Then Updesh</span>':'<span class="badge s-manager">Manager verifies</span> <span class="badge s-pratim">Then Pratim</span> <span class="badge s-updesh">Then Updesh</span>');
        return `<tr><td><b>${esc(u.fullName||u.displayName||u.username)}</b><div class="muted">${esc(u.username||'')}</div></td><td>${esc(u.role||'user')}</td><td><select data-user="${esc(userKey(u))}" data-username="${esc(u.username||'')}" data-fullname="${esc(u.fullName||u.displayName||u.username||'')}"><option value="">-- Select manager --</option>${managers.map(m=>`<option value="${esc(m.username||m.fullName)}" ${norm(currentVal)===norm(m.username)||norm(currentVal)===norm(m.fullName)?'selected':''}>${esc(m.fullName||m.username)} (${esc(m.username||m.role||'')})</option>`).join('')}</select></td><td>${next}</td></tr>`;
      }).join('')}
    </tbody></table></div></div>`;
}
async function savePaymsSettings(){
  if(!canManageSettings())return showToast('Only Updesh can save settings','error');
  const reportingManagers={};
  document.querySelectorAll('#tab-settings select[data-user]').forEach(sel=>{
    const userKeyVal=sel.getAttribute('data-user'),managerVal=sel.value;
    const mgr=usersData.find(u=>norm(u.username)===norm(managerVal)||norm(u.fullName)===norm(managerVal));
    if(managerVal)reportingManagers[userKeyVal]={username:mgr?.username||managerVal,fullName:mgr?.fullName||managerVal,role:mgr?.role||'manager'};
  });
  await db.collection(SETTINGS_COL).doc('hierarchy').set({reportingManagers,pratim:{username:'pratim',fullName:'Pratim'},updesh:{username:'updesh',fullName:'Updesh'},updatedAt:nowIso(),updatedBy:currentUser,updatedByName:roleName()},{merge:true});
  showToast('PayMS reporting hierarchy saved');
}

window.addEventListener('load',initializeAuth);
document.addEventListener('DOMContentLoaded',()=>{if(!currentUser)initializeAuth()});
</script>
