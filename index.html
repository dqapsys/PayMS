  <style>

    .header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:26px 22px;border-radius:var(--rad);margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .header h1{font-size:26px;margin-bottom:5px;display:flex;align-items:center;gap:10px;font-weight:700}
    .header p{opacity:.9;font-size:13px}.userbox{background:rgba(255,255,255,.18);padding:11px 14px;border-radius:8px;min-width:210px}.userbox .lbl{font-size:10px;opacity:.85;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.userbox .nm{font-size:13px;font-weight:700}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab-btn{padding:9px 14px;border-radius:7px;border:1px solid var(--bds);background:var(--card);color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:6px}.tab-btn:hover{border-color:var(--p);background:var(--pl)}.tab-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
    .tab-content{display:none}.tab-content.active{display:block}.card{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:16px;margin-bottom:14px}.card-header{font-size:13px;font-weight:700;margin:-16px -16px 14px;padding:12px 16px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:13px;display:flex;gap:11px;align-items:center}.stat-icon{width:36px;height:36px;background:var(--pl);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--p);font-size:19px;flex-shrink:0}.stat-value{font-size:20px;font-weight:700;color:var(--p)}.stat-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
    table{width:100%;border-collapse:collapse}th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;background:#f5f5f5;border-bottom:.5px solid var(--bd);color:var(--t2)}td{padding:9px 10px;border-bottom:.5px solid var(--bd);vertical-align:top}tr:hover td{background:#fafafa}.table-wrap{overflow-x:auto}
    .btn{padding:7px 12px;border-radius:7px;border:.5px solid var(--bds);background:transparent;color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap}.btn:hover{background:#f0f0f0}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.primary:hover{background:var(--pd)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.paynow{background:#2E7D32;color:#fff;border-color:#2E7D32}.btn.paynow:hover{background:#1B5E20}.btn.bad{color:var(--bad);border-color:#EF9A9A}.btn.sm{padding:5px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{font-family:inherit}input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:#fafafa;color:var(--t1);font-size:12.5px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);background:#fff}textarea{min-height:78px;resize:vertical}
    input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;margin:0;flex-shrink:0;accent-color:var(--p);background:none;border:none}
    .check-opt{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:#fafafa;cursor:pointer}.check-opt input{margin-top:2px}.check-opt .check-txt{display:flex;flex-direction:column;gap:2px}.check-opt .check-txt b{font-size:12.5px;font-weight:700}.check-opt .check-txt span{font-size:10.5px;color:var(--t2);text-transform:none;letter-spacing:normal;font-weight:400}
    .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}.form-group label{display:block;font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}.req::after{content:' *';color:var(--bad)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}.s-manager{background:#FFF3E0;color:#E65100}.s-pratim{background:#E3F2FD;color:#006994}.s-updesh{background:#F3E5F5;color:#6A1B9A}.s-dev{background:#E8F5E9;color:#1B5E20}.s-paid{background:#E8F5E9;color:#1B5E20}.s-rej{background:#FFEBEE;color:#B71C1C}.s-withdrawn{background:#ECEFF1;color:#455A64}.s-open{background:#ECEFF1;color:#455A64}.s-approved{background:#EDE7F6;color:#4527A0}.s-cleared{background:#E0F7FA;color:#00695C}
    .muted{color:var(--t2);font-size:11px}.strong{font-weight:700}.right{text-align:right}.hidden{display:none!important}.empty{text-align:center;color:var(--t2);padding:30px 12px}.audit-row{display:grid;grid-template-columns:145px 150px 1fr;gap:10px;border-bottom:.5px solid var(--bd);padding:9px 0}.history-row{cursor:pointer}.history-row.selected td{background:var(--pl)}.history-modal{position:fixed;inset:0;background:rgba(13,29,38,.55);z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px}.history-dialog{background:var(--card);width:min(1100px,100%);max-height:calc(100vh - 48px);overflow-y:auto;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.3);border:1px solid var(--bd)}.history-dialog .card-header{position:sticky;top:0;z-index:2;background:#fff;margin:0;padding:14px 16px}.history-dialog-body{padding:16px}.modal-close{width:32px;height:32px;padding:0;justify-content:center;font-size:18px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}.detail-item{background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:10px}.detail-item .lbl{color:var(--t2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}.detail-item .val{font-weight:600;line-height:1.5;overflow-wrap:anywhere}.detail-section{margin-top:16px}.detail-section h3{font-size:12px;margin-bottom:8px}.detail-links{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:#1A237E;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.18)}.toast.error{background:var(--bad)}.toast.success{background:var(--ok)}
    .error-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.error-card{background:#fff;border-radius:12px;border:.5px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:520px;padding:26px;text-align:center}.error-card h2{color:var(--bad);margin-bottom:8px}
    @media(max-width:720px){.container{padding:12px}.header{align-items:flex-start;flex-direction:column}.audit-row{grid-template-columns:1fr}.tabs{gap:6px}.tab-btn{padding:8px 10px}.card{padding:12px}.card-header{margin:-12px -12px 12px;padding:10px 12px}.history-modal{padding:8px}.history-dialog{max-height:calc(100vh - 16px)}.history-dialog-body{padding:12px}}
  </style>
</head>
<body>
<div id="appContainer" class="container" style="display:none">
  <div class="header">
    <div><h1><i class="ti ti-receipt-rupee"></i> PayMS</h1><p>Payment requests, approvals, finance recording and audit trail</p></div>
    <div class="userbox"><div class="lbl">Logged in as</div><div class="nm" id="currentUser">-</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
    <button class="tab-btn" data-tab="new" onclick="startNewRequest()"><i class="ti ti-plus"></i>New Request</button>
    <button class="tab-btn" data-tab="approvals" onclick="switchTab('approvals')"><i class="ti ti-checkup-list"></i>Approvals</button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')"><i class="ti ti-history"></i>History</button>
    <button class="tab-btn" data-tab="settings" id="settingsTabBtn" onclick="switchTab('settings')" style="display:none"><i class="ti ti-settings"></i>Settings</button>
  </div>

  <section id="tab-dashboard" class="tab-content active"></section>
  <section id="tab-new" class="tab-content"></section>
  <section id="tab-approvals" class="tab-content"></section>
  <section id="tab-history" class="tab-content"></section>
  <section id="tab-settings" class="tab-content"></section>
  <div id="restoreModalRoot"></div>
  <input type="file" id="restore-file-input" accept="application/json" style="display:none" onchange="handleRestoreFile(this)">
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBV2ZQwfqvgPyzLz75wsSIg9N5gjPHY-R8",
  authDomain:"dqap-wiki.firebaseapp.com",
  projectId:"dqap-wiki",
  storageBucket:"dqap-wiki.firebasestorage.app",
  messagingSenderId:"932523956178",
  appId:"1:932523956178:web:cc83a8e7369eaa80649a0b"
});
const db=firebase.firestore();
const PAYMS_COL='dqap_payms_requests',SETTINGS_COL='dqap_payms_settings',USERS_COL='dqap_users',PROJ_COL='dqap_projects',CRM_CUSTOMERS='dqap_crm_customers',CRM_DEALS='dqap_crm_deals';
const DRIVE_UPLOAD_API_URL='https://upload-receipt-932523956178.asia-south2.run.app';
const MAX_RECEIPT_BYTES=15*1024*1024;
const PAYMS_BUILD='20260723.4';
const DEFAULT_EXPENSE_TYPES=['Tour Advance','Vendor Payment','Reimbursement','Other Advance'];
let currentUser=null,currentUserRole=null,currentUserData=null,wikiSession=null,authInitialized=false;
let paymsData=[],usersData=[],projectsData=[],contactsData=[],dealsData=[],paymsUnsub=null,settingsUnsub=null,paymsSettings={reportingManagers:{},expenseTypes:[...DEFAULT_EXPENSE_TYPES]},activeTab='dashboard',selectedPaymentId='',selectedApprovalId='',editingRequestId='',historySearchQuery='';
let restorePreviewRequests=null,restoreBackupSettings=null,restoreIncludeSettings=false,restoreInProgress=false;
// Expense types that MUST have a Project or Sales/BD link selected before a request can be submitted.
const LINK_REQUIRED_TYPES=['tour advance','out station travel','emd'];
// Expense types treated as an "advance" for the purpose of auto-adjusting a later claim on the same project/BD.
// Matches on the word "advance" appearing anywhere in the type name (covers Tour Advance, Other Advance, etc).
function isAdvanceType(type){return /advance/i.test(String(type||''))}
function requiresExpenseLink(type){return LINK_REQUIRED_TYPES.includes(norm(type))}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function el(id){return document.getElementById(id)}
function g(id){return(el(id)?.value||'').trim()}
function fmtAmt(n){return Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().split('T')[0]}
function nowIso(){return new Date().toISOString()}
function norm(s){return String(s||'').trim().toLowerCase()}
function configuredExpenseTypes(existingType=''){
  const saved=Array.isArray(paymsSettings.expenseTypes)?paymsSettings.expenseTypes:DEFAULT_EXPENSE_TYPES;
  const list=saved.map(v=>String(v||'').trim()).filter(Boolean);
  if(existingType&&!list.some(v=>norm(v)===norm(existingType)))list.push(existingType);
  return list.length?list:[...DEFAULT_EXPENSE_TYPES];
}
function roleName(){return currentUserData?.displayName||currentUserData?.fullName||currentUser||'-'}
function isUser(name){return norm(currentUser)===norm(name)||norm(currentUserData?.fullName)===norm(name)}
function isAdmin(){return ['admin','tech_admin'].includes(norm(currentUserRole))||norm(currentUser)==='updesh'}
function isDev(){return norm(currentUser)==='dev'||norm(currentUserData?.fullName)==='dev'||isAdmin()}
function isPratim(){return norm(currentUser)==='pratim'||norm(currentUserData?.fullName).includes('pratim')||isAdmin()}
function isUpdesh(){return norm(currentUser)==='updesh'||norm(currentUserData?.fullName).includes('updesh');}
function isDevOnly(){return norm(currentUser)==='dev'||norm(currentUserData?.fullName)==='dev'}
function canSeePayNow(){return isUpdesh()||isDevOnly()}
function canManageSettings(){return norm(currentUser)==='updesh'||norm(currentUserData?.fullName).includes('updesh')}
function showToast(msg,type='success'){const t=document.createElement('div');t.className='toast '+(type==='error'?'error':'success');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function showError(message){const d=document.createElement('div');d.className='error-screen';d.innerHTML=`<div class="error-card"><h2>PayMS Access</h2><p style="color:var(--t2);line-height:1.6">${esc(message)}</p><button class="btn primary" style="margin-top:16px" onclick="location.href='https://dqapsys.github.io/dqap-wiki/'">Go to Wiki</button></div>`;document.body.appendChild(d);el('appContainer').style.display='none'}
function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}
function backupTimestamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
function exportBackupJson(){
  if(!isUpdesh())return showToast('Only Updesh can export PayMS data','error');
  const payload={exportedAt:nowIso(),exportedBy:roleName(),requestCount:paymsData.length,settings:paymsSettings,requests:paymsData};
  downloadFile(`PayMS_Backup_${backupTimestamp()}.json`,JSON.stringify(payload,null,2),'application/json');
  showToast(`Backup downloaded (${paymsData.length} requests)`);
}
function csvEscape(v){const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportBackupCsv(){
  if(!isUpdesh())return showToast('Only Updesh can export PayMS data','error');
  const cols=['Claim ID','Type','Title','Expense Date','Amount','Project Expense','Sales/BD Expense','Project','CRM Link','Vendor','Purpose','Status','Submitter','Manager','Created','Updated','Advance Applied','Net Payable','Net Receivable','Payment Method','Payment Date','Payment Ref'];
  const rows=paymsData.map(r=>{
    const adj=r.advanceAdjustment||{},p=r.payment||{};
    return[r.requestNo||r.id,r.type,r.title,r.expenseDate,r.amount,r.projectExpense?'Yes':'No',r.salesBdExpense?'Yes':'No',r.projectId?projectLabel(r.projectId):'',r.crmId?`${r.crmType||''}: ${crmLabel(r.crmType,r.crmId)}`:'',r.vendor,r.purpose,r.status,r.submitterName||r.submitterUsername,r.managerName||r.managerUsername,r.createdAt,r.updatedAt,adj.advanceApplied||'',adj.netPayable||'',adj.netReceivable||'',p.method||'',p.date||'',p.utr||p.cheque||''].map(csvEscape).join(',');
  });
  const csv=[cols.join(','),...rows].join('\n');
  downloadFile(`PayMS_Backup_${backupTimestamp()}.csv`,csv,'text/csv');
  showToast(`CSV export downloaded (${paymsData.length} requests)`);
}
function triggerRestoreFile(){
  if(!isUpdesh())return showToast('Only Updesh can restore PayMS data','error');
  el('restore-file-input')?.click();
}
async function handleRestoreFile(input){
  if(!isUpdesh())return showToast('Only Updesh can restore PayMS data','error');
  const file=input.files?.[0];if(!file)return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    const requests=Array.isArray(payload.requests)?payload.requests:(Array.isArray(payload)?payload:null);
    if(!requests)throw new Error('This file does not look like a PayMS backup (no "requests" array found)');
    restorePreviewRequests=requests;
    restoreBackupSettings=(payload.settings&&typeof payload.settings==='object')?payload.settings:null;
    restoreIncludeSettings=false;
    renderRestoreModal();
  }catch(e){
    showToast('Could not read backup file: '+e.message,'error');
  }finally{
    input.value='';
  }
}
function cancelRestore(){restorePreviewRequests=null;restoreBackupSettings=null;restoreIncludeSettings=false;restoreInProgress=false;renderRestoreModal();}
function renderRestoreModal(){
  const root=el('restoreModalRoot');if(!root)return;
  if(!restorePreviewRequests){root.innerHTML='';return;}
  const existingIds=new Set(paymsData.map(r=>r.id));
  const missing=restorePreviewRequests.filter(r=>r.id&&!existingIds.has(r.id));
  const already=restorePreviewRequests.length-missing.length;
  const nothingToDo=missing.length===0&&!(restoreBackupSettings&&restoreIncludeSettings);
  root.innerHTML=`<div class="history-modal" role="dialog" aria-modal="true" aria-label="Restore backup" onclick="if(event.target===this&&!restoreInProgress)cancelRestore()"><div class="history-dialog" style="max-width:560px">
    <div class="card-header"><span>Restore from Backup</span><button class="btn modal-close" type="button" onclick="cancelRestore()" ${restoreInProgress?'disabled':''}><i class="ti ti-x"></i></button></div>
    <div class="history-dialog-body">
      <div class="detail-grid">
        <div class="detail-item"><div class="lbl">In backup file</div><div class="val">${restorePreviewRequests.length}</div></div>
        <div class="detail-item"><div class="lbl">Already in system (skipped)</div><div class="val">${already}</div></div>
        <div class="detail-item"><div class="lbl">Will be added</div><div class="val strong" style="color:var(--ok)">${missing.length}</div></div>
      </div>
      <div class="muted" style="margin-bottom:12px">This restore is <b>additive-only</b>: claims already present in the system (matched by Claim ID) are never touched, changed, or overwritten. Only claims missing from the current database are added back, each stamped with a "Restored from backup" audit entry.</div>
      ${restoreBackupSettings?`<label class="check-opt" style="margin-bottom:12px"><input type="checkbox" id="restore-settings-check" ${restoreIncludeSettings?'checked':''} onchange="restoreIncludeSettings=this.checked" ${restoreInProgress?'disabled':''}><span class="check-txt"><b>Also restore settings</b><span>Adds expense types and reporting-manager mappings found in the backup but missing from current settings. Existing settings are never overwritten.</span></span></label>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn primary" ${nothingToDo||restoreInProgress?'disabled':''} onclick="confirmRestore()"><i class="ti ti-database-import"></i>${restoreInProgress?'Restoring...':'Confirm Restore'}</button>
        <button class="btn" onclick="cancelRestore()" ${restoreInProgress?'disabled':''}>Cancel</button>
      </div>
    </div>
  </div></div>`;
}
async function confirmRestore(){
  if(!isUpdesh())return showToast('Only Updesh can restore PayMS data','error');
  if(!restorePreviewRequests||restoreInProgress)return;
  const existingIds=new Set(paymsData.map(r=>r.id));
  const missing=restorePreviewRequests.filter(r=>r.id&&!existingIds.has(r.id));
  const willRestoreSettings=!!(restoreBackupSettings&&restoreIncludeSettings);
  if(!missing.length&&!willRestoreSettings)return showToast('Nothing to restore','error');
  if(!confirm(`Restore ${missing.length} missing claim(s)${willRestoreSettings?' and merge settings':''}?\n\nExisting claims and settings are never overwritten.`))return;
  restoreInProgress=true;renderRestoreModal();
  try{
    for(let i=0;i<missing.length;i+=450){
      const batch=db.batch();
      missing.slice(i,i+450).forEach(r=>{
        const{id,...data}=r;
        const ref=db.collection(PAYMS_COL).doc(id);
        const audit=[...(data.audit||[]),{time:nowIso(),actor:roleName(),action:'Restored from backup by Updesh'}];
        batch.set(ref,{...data,audit,restoredAt:nowIso(),restoredBy:currentUser,restoredByName:roleName()});
      });
      await batch.commit();
    }
    if(willRestoreSettings){
      const currentExpenseTypes=configuredExpenseTypes();
      const backupExpenseTypes=Array.isArray(restoreBackupSettings.expenseTypes)?restoreBackupSettings.expenseTypes:[];
      const mergedExpenseTypes=[...currentExpenseTypes];
      backupExpenseTypes.forEach(t=>{if(t&&!mergedExpenseTypes.some(x=>norm(x)===norm(t)))mergedExpenseTypes.push(t);});
      const backupManagers=restoreBackupSettings.reportingManagers||{};
      const mergedManagers={...backupManagers,...(paymsSettings.reportingManagers||{})};
      await db.collection(SETTINGS_COL).doc('hierarchy').set({expenseTypes:mergedExpenseTypes,reportingManagers:mergedManagers,updatedAt:nowIso(),updatedBy:currentUser,updatedByName:roleName()},{merge:true});
    }
    showToast(`Restored ${missing.length} claim(s)${willRestoreSettings?' and merged settings':''}`);
    cancelRestore();
  }catch(e){
    showToast('Restore failed: '+e.message,'error');
    restoreInProgress=false;renderRestoreModal();
  }
}

function initializeAuth(){
  if(authInitialized)return;authInitialized=true;
  let sess=null;
  const fragment=new URLSearchParams(window.location.hash.slice(1));
  const query=new URLSearchParams(window.location.search);
  const handoffSession=fragment.get('sess')||query.get('sess');
  const receivedHandoff=!!handoffSession;
  try{sess=sessionStorage.getItem('dqap_sess')}catch(e){}
  if(!sess){
    try{

async function migrateLegacyApprovedClaims(){
  // One-time correction: claims that reached READY_FOR_PAYMENT under the old
  // workflow (before the Pay Now step existed) never went through an explicit
  // Pay Now action. They are approved but not actually cleared for transfer,
  // so they're moved back to APPROVED and re-queued for Pay Now clearance.
  if(legacyMigrationDone||!isUpdesh())return;
  legacyMigrationDone=true;
  const legacy=paymsData.filter(r=>r.status==='READY_FOR_PAYMENT'&&!(r.audit||[]).some(a=>String(a?.action||'').startsWith('Pay Now:')));
  if(!legacy.length)return;
  try{
    const batch=db.batch();
    legacy.forEach(r=>{
      const ref=db.collection(PAYMS_COL).doc(r.id);
      const audit=[...(r.audit||[]),{time:nowIso(),actor:roleName(),action:'Migrated: previously approved but unpaid claim moved back to Approved — requires explicit Pay Now clearance before Dev payment'}];
      batch.update(ref,{status:'APPROVED',updatedAt:nowIso(),audit});
    });
    await batch.commit();
    showToast(`${legacy.length} previously approved claim${legacy.length===1?'':'s'} moved to Approved — awaiting Pay Now`);
  }catch(e){console.error('Legacy claim migration failed',e)}
}

function directReportKeysOf(managerIdentityKeys){
  const map=paymsSettings.reportingManagers||{};
  const found=new Set();
  Object.keys(map).forEach(subKey=>{
    const mgr=map[subKey];
    const mgrKeys=[norm(mgr?.username),norm(mgr?.fullName)].filter(Boolean);
    if(mgrKeys.some(k=>managerIdentityKeys.includes(k)))found.add(subKey);
  });

function allReportKeysRecursive(rootIdentityKeys){
  // Walks the FULL chain underneath the given person - direct reports, their
  // reports, and so on - not just one level. Guarded against cycles/depth.
  const visitedSubKeys=new Set();
  const seenIdentity=new Set(rootIdentityKeys);
  let frontier=[...rootIdentityKeys];
  let guard=0;
  while(frontier.length&&guard<25){
    guard++;
    const directSubKeys=[...directReportKeysOf(frontier)].filter(k=>!visitedSubKeys.has(k));
    if(!directSubKeys.length)break;
    const nextFrontier=[];
    directSubKeys.forEach(subKey=>{
      visitedSubKeys.add(subKey);
      const userRec=usersData.find(u=>userKey(u)===subKey);
      const idKeys=userRec?[norm(userRec.username),norm(userRec.fullName)].filter(Boolean):[subKey];
      idKeys.forEach(k=>{if(!seenIdentity.has(k)){seenIdentity.add(k);nextFrontier.push(k);}});
    });
    frontier=nextFrontier;
  }
  return visitedSubKeys;
}
function advanceCandidatesFor(projectId,crmType,crmId,submitterKey){

// Reads and consumes outstanding advance docs (FIFO) inside an in-flight Firestore transaction.
// Must be called BEFORE any tx.set/tx.update in the surrounding transaction (Firestore read-before-write rule).
async function computeAndConsumeAdvances(tx,projectId,crmType,crmId,claimAmount,submitterKey,newRequestNo){
  const candidates=advanceCandidatesFor(projectId,crmType,crmId,submitterKey);
  const snaps=[];let totalOutstanding=0;
  for(const adv of candidates){
    const ref=db.collection(PAYMS_COL).doc(adv.id);
    const snap=await tx.get(ref);
    if(!snap.exists)continue;
    const latest=snap.data();
    const avail=Math.max(0,Number(latest.amount||0)-Number(latest.advanceAdjustedTotal||0));
    if(avail>0){totalOutstanding+=avail;snaps.push({ref,latest,avail});}
  }
  let remaining=claimAmount,sources=[];
  for(const s of snaps){
    if(remaining<=0)break;
    const take=Math.min(s.avail,remaining);
    if(take<=0)continue;
    const already=Number(s.latest.advanceAdjustedTotal||0);
    sources.push({claimId:s.ref.id,requestNo:s.latest.requestNo||s.ref.id,amount:take});
    tx.update(s.ref,{advanceAdjustedTotal:already+take,updatedAt:nowIso(),audit:[...(s.latest.audit||[]),{time:nowIso(),actor:roleName(),action:`Rs ${fmtAmt(take)} adjusted against claim ${newRequestNo||''}`.trim()}]});
    remaining-=take;
  }
  return{advanceApplied:claimAmount-remaining,totalOutstanding,sources};
}

async function uploadReceiptToDrive(file,options){
  const fileBase64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;reader.readAsDataURL(file);
  });
  const body=options.targetFolderId
    ?{action:'uploadProjectDoc',fileName:file.name,mimeType:file.type||'application/octet-stream',fileBase64,targetFolderId:options.targetFolderId,uploadedByName:roleName()}
    :{action:'uploadReceipt',fileName:file.name,mimeType:file.type||'application/octet-stream',fileBase64,claimId:options.claimId,submitterName:roleName()};
  const resp=await fetch(DRIVE_UPLOAD_API_URL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!resp.ok){const err=await resp.json().catch(()=>({}));throw new Error(err.error||'Upload failed')}
  return resp.json();
}
async function submitRequest(){
  const source=editingRequestId?paymsData.find(r=>r.id===editingRequestId):null;
  if(editingRequestId&&!canEditRequest(source))return showToast('This claim is no longer pending and cannot be edited','error');
  const type=g('f-type'),expenseDate=g('f-expense-date'),amount=Number(g('f-amount')),title=g('f-title'),projectExpense=!!el('f-project-expense')?.checked,salesBdExpense=!!el('f-sales-expense')?.checked,projectId=projectExpense?g('f-project'):'',crmRaw=salesBdExpense?g('f-crm'):'',vendor=g('f-vendor'),purpose=g('f-purpose'),managerRaw=g('f-manager');
  if(!title||!expenseDate||!amount||!purpose)return showToast('Enter title, expense incurred date, amount and purpose','error');
  if(!managerRaw)return showToast('Reporting manager is not mapped. Ask Updesh to configure PayMS Settings.','error');
  if(requiresExpenseLink(type)&&!projectExpense&&!salesBdExpense)return showToast(`Select either Project Expense or Sales/BD Expense for ${type}`,'error');
  if(projectExpense&&!projectId)return showToast('Select Wiki project for Project expense','error');
  if(salesBdExpense&&!crmRaw)return showToast('Select CRM contact/deal for Sales/BD expense','error');
  if(type==='Vendor Payment'&&!vendor)return showToast('Vendor / payee is required for vendor payment','error');
  const receiptFile=el('f-receipt')?.files?.[0]||null;
  if(receiptFile&&receiptFile.size>MAX_RECEIPT_BYTES)return showToast(`Receipt exceeds ${MAX_RECEIPT_BYTES/(1024*1024)}MB limit`,'error');
  const [crmType,crmId]=(crmRaw||'|').split('|');const mgr=usersData.find(u=>(u.username||u.fullName)===managerRaw)||{};
  const ref=db.collection(PAYMS_COL).doc();
  const requestNo='PAY-'+ref.id.slice(0,6).toUpperCase();
  const flow=initialWorkflowForManager(mgr);
  const req={requestNo,type,expenseDate,title,amount,projectExpense,salesBdExpense,projectId,crmType,crmId,vendor,purpose,status:flow.status,submitterUsername:currentUser,submitterName:roleName(),managerUsername:mgr.username||managerRaw,managerName:mgr.fullName||managerRaw,createdAt:nowIso(),updatedAt:nowIso(),audit:[{time:nowIso(),actor:roleName(),action:source?`Resubmitted from ${source.requestNo||source.id} with a fresh claim ID; ${flow.audit}`:flow.audit}]};
  if(source){req.supersedesClaimId=source.id;req.supersedesRequestNo=source.requestNo||source.id;req.resubmissionNumber=Number(source.resubmissionNumber||0)+1;if(source.receipt)req.receipt=source.receipt;}
  const btn=el('submitBtn');if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i>Submitting...';}
  try{
    if(receiptFile){
      const statusEl=el('f-receipt-status');if(statusEl)statusEl.textContent='Uploading to Google Drive...';
      const projectFolderId=projectExpense&&projectId?(projectsData.find(p=>p.id===projectId)?.driveFolderId||''):'';
      if(projectExpense&&projectId&&!projectFolderId){
        showToast('This project has no Drive folder yet. Ask Updesh to create it from PMO in Wiki, or remove the attachment and submit without it.','error');
        if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-send"></i>Submit to Reporting Manager';}
        return;
      }
      const data=await uploadReceiptToDrive(receiptFile,projectFolderId?{targetFolderId:projectFolderId}:{claimId:requestNo});
      req.receipt={fileName:data.fileName,webViewLink:data.webViewLink,uploadedByName:roleName(),uploadedAt:nowIso(),sizeKB:Math.round((data.sizeBytes||receiptFile.size||0)/1024)};
    }
    const wantsAdvanceAdjustment=!isAdvanceType(type)&&(!!projectId||!!crmId);
    if(source){
      const oldRef=db.collection(PAYMS_COL).doc(source.id);
      await db.runTransaction(async tx=>{
        const oldSnap=await tx.get(oldRef);
        if(!oldSnap.exists)throw new Error('Original claim no longer exists');
        const latest={id:oldSnap.id,...oldSnap.data()};
        if(!canEditRequest(latest))throw new Error('Original claim is no longer pending or does not belong to you');
        if(wantsAdvanceAdjustment){
          const result=await computeAndConsumeAdvances(tx,projectId,crmType,crmId,amount,norm(currentUser),requestNo);
          if(result.totalOutstanding>0)req.advanceAdjustment={advanceApplied:result.advanceApplied,netPayable:Math.max(amount-result.advanceApplied,0),netReceivable:Math.max(result.totalOutstanding-result.advanceApplied,0),sources:result.sources};
        }
        const changedAt=nowIso(),oldAudit=[...(latest.audit||[]),{time:changedAt,actor:roleName(),action:`Withdrawn by User for correction and resubmitted as ${requestNo}`}];
        tx.update(oldRef,{status:'WITHDRAWN_BY_USER',withdrawnAt:changedAt,withdrawnBy:currentUser,withdrawnByName:roleName(),supersededByClaimId:ref.id,supersededByRequestNo:requestNo,updatedAt:changedAt,audit:oldAudit});
        tx.set(ref,req);
      });
      editingRequestId='';showToast(`Claim withdrawn and resubmitted as ${requestNo}`);
    }else if(wantsAdvanceAdjustment){
      await db.runTransaction(async tx=>{
        const result=await computeAndConsumeAdvances(tx,projectId,crmType,crmId,amount,norm(currentUser),requestNo);
        if(result.totalOutstanding>0)req.advanceAdjustment={advanceApplied:result.advanceApplied,netPayable:Math.max(amount-result.advanceApplied,0),netReceivable:Math.max(result.totalOutstanding-result.advanceApplied,0),sources:result.sources};
        tx.set(ref,req);
      });
      showToast('Request submitted');
    }else{await ref.set(req);showToast('Request submitted');}
    switchTab('dashboard');
  }catch(e){
    showToast('Request not submitted: '+e.message+'. Please retry.','error');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-send"></i>Submit to Reporting Manager';}
  }
}

async function forceRejectRequest(id){
  const reason=prompt('Reason for rejecting this already-approved/cleared claim');if(reason===null)return;
  const r=paymsData.find(x=>x.id===id);
  if(!r||!canForceReject(r))return showToast('This claim can no longer be rejected','error');
  if(!confirm(`Reject ${r.requestNo||r.id} even though it was already approved/cleared for payment?\n\nAmount: Rs ${fmtAmt(r.amount)}\nThis cannot be undone.`))return;
  try{
    await db.runTransaction(async tx=>{
      const ref=db.collection(PAYMS_COL).doc(id),snap=await tx.get(ref);
      if(!snap.exists)throw new Error('Claim no longer exists');
      const latest={id:snap.id,...snap.data()};
      if(!canForceReject(latest))throw new Error('Claim changed and is no longer eligible for override rejection');
      const audit=[...(latest.audit||[]),{time:nowIso(),actor:roleName(),action:`Rejected by Updesh after prior approval/clearance (override). Reason: ${reason||'No reason entered'}`}];
      tx.update(ref,{status:'REJECTED',updatedAt:nowIso(),audit});

  }catch(e){showToast(e.message,'error')}
}

function openApprovalClaim(id){selectedApprovalId=id;renderApprovals()}
function closeApprovalClaim(){selectedApprovalId='';renderApprovals()}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(selectedPaymentId&&activeTab==='history')closeHistoryClaim();if(selectedApprovalId&&activeTab==='approvals')closeApprovalClaim();if(restorePreviewRequests&&!restoreInProgress)cancelRestore();});
function paymentForm(r){const disabled=r.status==='PAID'||!isDev()?'disabled':'';return`<div class="form-row"><div class="form-group"><label>Method</label><select id="pay-method" onchange="paymentMethodChanged()" ${disabled}><option>Bank Transfer</option><option>Cheque</option><option>Cash</option></select></div><div class="form-group"><label>Payment Date</label><input id="pay-date" type="date" value="${today()}" ${disabled}></div><div class="form-group bank-field"><label>Bank</label><input id="pay-bank" value="YES Bank" ${disabled}></div><div class="form-group utr-field"><label>UTR</label><input id="pay-utr" value="UTR202406300001" ${disabled}></div><div class="form-group cheque-field hidden"><label>Cheque Number</label><input id="pay-cheque" ${disabled}></div><div class="form-group"><label>Notes</label><textarea id="pay-notes" ${disabled}></textarea></div></div>${r.status==='PAID'?'<span class="badge s-paid">Status: PAID</span>':`<button class="btn ok" onclick="recordPayment('${r.id}')" ${disabled}><i class="ti ti-check"></i>Record Payment & Complete</button>`}${!isDev()?'<div class="muted" style="margin-top:8px">Only Dev / admin can record payment.</div>':''}`}
function paymentMethodChanged(){const m=g('pay-method');document.querySelectorAll('.bank-field').forEach(x=>x.classList.toggle('hidden',m==='Cash'));document.querySelectorAll('.utr-field').forEach(x=>x.classList.toggle('hidden',m!=='Bank Transfer'));document.querySelectorAll('.cheque-field').forEach(x=>x.classList.toggle('hidden',m!=='Cheque'))}
async function recordPayment(id){const r=paymsData.find(x=>x.id===id);if(!r||r.status!=='READY_FOR_PAYMENT')return showToast('Only ready-for-payment requests can be recorded','error');if(!isDev())return showToast('Switch to Dev finance user','error');const method=g('pay-method'),date=g('pay-date'),bank=g('pay-bank'),utr=g('pay-utr'),cheque=g('pay-cheque'),notes=g('pay-notes');if(method==='Bank Transfer'&&(!date||!bank||!utr))return showToast('Bank Transfer requires date, bank and UTR','error');if(method==='Cheque'&&(!date||!bank||!cheque))return showToast('Cheque requires date, bank and cheque number','error');if(method==='Cash'&&(!date||!notes))return showToast('Cash requires date and notes','error');const payment={method,date,bank,utr,cheque,notes,recordedBy:currentUser,recordedByName:roleName(),recordedAt:nowIso()};const changedAt=nowIso(),audit=[...(r.audit||[]),{time:changedAt,actor:roleName(),action:`Recorded ${method} payment. Status PAID${notes?'; comments: '+notes:''}`}];await db.collection(PAYMS_COL).doc(id).update({payment,status:'PAID',updatedAt:changedAt,audit});showToast('Status -> PAID')}
function renderSettings(){
  const tab=el('tab-settings');if(!tab)return;
  if(!canManageSettings()){tab.innerHTML='';return;}
  const managers=usersData.filter(u=>['manager','admin'].includes(norm(u.role))||norm(u.username)==='pratim'||norm(u.username)==='updesh');
  const users=usersData.filter(u=>norm(u.username)!=='updesh'&&!norm(u.fullName).includes('updesh')&&norm(u.username)!=='pratim'&&!norm(u.fullName).includes('pratim'));
  const map=paymsSettings.reportingManagers||{};
  const expenseTypes=configuredExpenseTypes();
  tab.innerHTML=`<div class="card"><div class="card-header">Expense Types <button class="btn primary sm" onclick="addExpenseType()"><i class="ti ti-plus"></i>Add Expense Type</button></div>
    <div class="muted" style="margin-bottom:12px">These options appear in the Expense Type list when a payment request is created or resubmitted.</div>
    <div class="table-wrap"><table><thead><tr><th>Expense Type</th><th style="width:120px">Action</th></tr></thead><tbody>
      ${expenseTypes.map((type,index)=>`<tr><td><b>${esc(type)}</b></td><td><button class="btn sm" onclick="editExpenseType(${index})"><i class="ti ti-edit"></i>Edit</button></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card"><div class="card-header">PayMS approval hierarchy <button class="btn primary sm" onclick="savePaymsSettings()"><i class="ti ti-device-floppy"></i>Save Settings</button></div>
    <div style="background:var(--pl);border-radius:8px;padding:11px 12px;margin-bottom:12px;font-size:12px;line-height:1.6">
      <b>Approval chain:</b> Submitter -> Reporting Manager -> Pratim -> Updesh -> Dev payment.<br>
      Direct reports to Pratim start at Pratim. Direct reports to Updesh start at Updesh, with an optional referral to Pratim.
    </div>
    <div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Reporting Manager</th><th>Next Levels</th></tr></thead><tbody>
      ${users.map(u=>{
        const current=map[userKey(u)]||{};
        const currentVal=current.username||current.fullName||current||'';
        const next=isUpdeshValue(currentVal)?'<span class="badge s-updesh">Direct Updesh approval</span> <span class="badge s-pratim">Pratim optional</span>':(isPratimValue(currentVal)?'<span class="badge s-pratim">Pratim verifies</span> <span class="badge s-updesh">Then Updesh</span>':'<span class="badge s-manager">Manager verifies</span> <span class="badge s-pratim">Then Pratim</span> <span class="badge s-updesh">Then Updesh</span>');
        return `<tr><td><b>${esc(u.fullName||u.displayName||u.username)}</b><div class="muted">${esc(u.username||'')}</div></td><td>${esc(u.role||'user')}</td><td><select data-user="${esc(userKey(u))}" data-username="${esc(u.username||'')}" data-fullname="${esc(u.fullName||u.displayName||u.username||'')}"><option value="">-- Select manager --</option>${managers.map(m=>`<option value="${esc(m.username||m.fullName)}" ${norm(currentVal)===norm(m.username)||norm(currentVal)===norm(m.fullName)?'selected':''}>${esc(m.fullName||m.username)} (${esc(m.username||m.role||'')})</option>`).join('')}</select></td><td>${next}</td></tr>`;
      }).join('')}
    </tbody></table></div></div>`;
}
async function persistExpenseTypes(expenseTypes,successMessage){
  if(!canManageSettings())return showToast('Only Updesh can change expense types','error');
  await db.collection(SETTINGS_COL).doc('hierarchy').set({expenseTypes,updatedAt:nowIso(),updatedBy:currentUser,updatedByName:roleName()},{merge:true});
  showToast(successMessage);
}
async function addExpenseType(){
  const value=String(prompt('Enter the new expense type')||'').trim();
  if(!value)return;
  const expenseTypes=configuredExpenseTypes();
  if(expenseTypes.some(type=>norm(type)===norm(value)))return showToast('This expense type already exists','error');
  try{await persistExpenseTypes([...expenseTypes,value],'Expense type added')}catch(e){showToast('Expense type not added: '+e.message,'error')}
}
async function editExpenseType(index){
  const expenseTypes=configuredExpenseTypes(),current=expenseTypes[index];
  if(current===undefined)return showToast('Expense type no longer exists','error');
  const value=String(prompt('Edit expense type',current)||'').trim();
  if(!value||value===current)return;
  if(expenseTypes.some((type,i)=>i!==index&&norm(type)===norm(value)))return showToast('This expense type already exists','error');
  expenseTypes[index]=value;
  try{await persistExpenseTypes(expenseTypes,'Expense type updated')}catch(e){showToast('Expense type not updated: '+e.message,'error')}
}
async function savePaymsSettings(){
  if(!canManageSettings())return showToast('Only Updesh can save settings','error');
  const reportingManagers={};
  document.querySelectorAll('#tab-settings select[data-user]').forEach(sel=>{
    const userKeyVal=sel.getAttribute('data-user'),managerVal=sel.value;
    const mgr=usersData.find(u=>norm(u.username)===norm(managerVal)||norm(u.fullName)===norm(managerVal));
    if(managerVal)reportingManagers[userKeyVal]={username:mgr?.username||managerVal,fullName:mgr?.fullName||managerVal,role:mgr?.role||'manager'};
  });
  await db.collection(SETTINGS_COL).doc('hierarchy').set({reportingManagers,pratim:{username:'pratim',fullName:'Pratim'},updesh:{username:'updesh',fullName:'Updesh'},updatedAt:nowIso(),updatedBy:currentUser,updatedByName:roleName()},{merge:true});
  showToast('PayMS settings saved');
}

window.addEventListener('load',initializeAuth);
document.addEventListener('DOMContentLoaded',()=>{if(!currentUser)initializeAuth()});
</script>
</body>
